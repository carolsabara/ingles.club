<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teste de nivelamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F1E8;--card:#EADFCF;--ink:#0E1E4A;--mut:#5E6685;--pri:#0E1E4A;--pri-ink:#FFFFFF;--acc:#C8102E;--red:#C8102E;--line:#D9CDB8;--ok:#12805A;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#F7F1E8;--card:#EADFCF;--ink:#0E1E4A;--mut:#5E6685;--pri:#0E1E4A;--pri-ink:#FFFFFF;--acc:#C8102E;--red:#C8102E;--line:#D9CDB8;--ok:#12805A}}
:root[data-theme="dark"]{--bg:#F7F1E8;--card:#EADFCF;--ink:#0E1E4A;--mut:#5E6685;--pri:#0E1E4A;--pri-ink:#FFFFFF;--acc:#C8102E;--red:#C8102E;--line:#D9CDB8;--ok:#12805A}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:22px 18px 40px}
h1,h2,h3{font-family:"Cormorant Garamond","DM Sans",system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:clamp(34px,9vw,48px);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(22px,5.5vw,28px);font-weight:600;margin:18px 0 16px}
p{margin:0 0 12px}
.mut{color:var(--mut)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);font-weight:500;margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px;cursor:pointer}
.opt:hover{border-color:var(--pri)}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 13%,var(--card));font-weight:700}
.btn{font:700 17px "DM Sans",sans-serif;background:var(--red);color:#fff;border:0;border-radius:14px;padding:14px 24px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--mut);font-weight:500;text-decoration:underline;padding:14px 8px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label{display:block}
input[type=text],input[type=tel],input[type=email]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:13px 14px;margin:6px 0 18px}
.play{display:flex;align-items:center;gap:12px;background:var(--red);color:#fff;border:0;border-radius:16px;font:700 17px "DM Sans",sans-serif;padding:16px 20px;width:100%;cursor:pointer;margin-bottom:6px}
.play:disabled{opacity:.45;cursor:not-allowed}
.ladder{display:flex;align-items:flex-end;gap:6px;height:150px;margin:18px 0 8px}
.ladder div{flex:1;border-radius:10px 10px 0 0;background:var(--line);display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font:800 18px "Cormorant Garamond",sans-serif;color:var(--mut)}
.ladder div.on{background:var(--pri);color:var(--pri-ink)}
.lvlbig{font:800 clamp(56px,16vw,84px)/1 "Cormorant Garamond",sans-serif;letter-spacing:-.03em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:15px}
.chip.nk{border-color:var(--acc)}
table{width:100%;border-collapse:collapse;margin:8px 0 16px}
td{padding:6px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700}
textarea{width:100%;height:120px;font:14px/1.4 ui-monospace,monospace;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.brand{display:flex;align-items:center;gap:12px;max-width:620px;margin:0 auto;padding:16px 18px 0}.brand img{width:46px;height:46px;border-radius:50%}.brand span{font:600 18px/1.1 "Cinzel",serif;letter-spacing:.14em}.brand b{color:var(--acc);font-weight:600}.brand small{display:block;font:500 12px "DM Sans",sans-serif;letter-spacing:.04em;color:var(--mut);margin-top:4px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mut);margin:-4px 0 14px;cursor:pointer}.ck input{width:auto;margin:3px 0 0;flex:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

<script>
const L=['A1','A2','B1','B2','C1'];
const Q=[
{p:0,v:0,t:'Verb to be',q:'She ___ a teacher.',o:['is','are','am','be']},
{p:0,v:0,t:'Present simple',q:'I ___ coffee every morning.',o:['drink','drinks','drinking','am drink']},
{p:0,v:0,t:'There is / there are',q:'There ___ two cats in the house.',o:['are','is','am','be']},
{p:0,v:0,t:'Family vocabulary',q:'My mother’s sister is my ___.',o:['aunt','niece','cousin','uncle']},
{p:0,v:1,t:'Past simple',q:'Yesterday I ___ to the mall.',o:['went','go','goed','gone']},
{p:0,v:1,t:'Comparatives',q:'My sister is ___ than me.',o:['taller','tall','tallest','more tall']},
{p:0,v:1,t:'Present continuous',q:'Be quiet! I’m ___ a movie.',o:['watching','watch','watches','to watch']},
{p:0,v:1,t:'Much / many',q:'How ___ water do you drink a day?',o:['much','many','few','lot']},
{p:0,v:2,t:'Present perfect',q:'I ___ here since 2020.',o:['have lived','live','lived','am living']},
{p:0,v:2,t:'First conditional',q:'If it rains tomorrow, we ___ at home.',o:['will stay','stay','would stay','stayed']},
{p:0,v:2,t:'Modal verbs',q:'You ___ wear a seatbelt. It’s the law.',o:['must','might','can','would']},
{p:0,v:2,t:'Be used to + -ing',q:'I’m not used to ___ up so early.',o:['waking','wake','woke','waked']},
{p:0,v:3,t:'Second conditional',q:'If I ___ more money, I’d buy a house.',o:['had','have','would have','will have']},
{p:0,v:3,t:'Passive voice',q:'The email ___ yesterday, but nobody read it.',o:['was sent','sent','has sent','is sent']},
{p:0,v:3,t:'Reported speech',q:'She asked me where ___.',o:['I lived','did I live','I live','am I living']},
{p:0,v:3,t:'Collocations',q:'I can’t ___ this noise anymore. It’s driving me crazy.',o:['stand','hold','carry','stay']},
{p:0,v:4,t:'Third conditional (inversion)',q:'Had I known about the traffic, I ___ earlier.',o:['would have left','would leave','will leave','had left']},
{p:0,v:4,t:'Inversion',q:'Not only ___ late, but he also forgot the documents.',o:['did he arrive','he arrived','arrived he','he did arrive']},
{p:0,v:4,t:'Would rather',q:'I’d rather you ___ smoke in here.',o:['didn’t','don’t','wouldn’t','won’t']},
{p:0,v:4,t:'Advanced vocabulary',q:'The company has been under ___ for its environmental record.',o:['scrutiny','screening','inspecting','glance']},
{p:1,v:0,t:'Listening: informações pessoais',s:'Hi, I’m Sam. I’m from Chicago, and I work in a coffee shop.',q:'Where does Sam work?',o:['In a coffee shop','In a bank','In a school','In Chicago']},
{p:1,v:1,t:'Listening: direções',s:'Excuse me, how do I get to the train station? Go straight for two blocks, then turn left. It’s next to the bank.',q:'Where is the train station?',o:['Next to the bank','Two blocks behind','On the right','Across the school']},
{p:1,v:2,t:'Listening: planos e motivos',s:'I was going to go to the gym after work, but my boss asked me to stay late. So I just went home and watched a movie.',q:'Why didn’t the speaker go to the gym?',o:['Their boss asked them to stay late','They were too tired','The gym was closed','They wanted to watch a movie']},
{p:1,v:3,t:'Listening: condicionais no passado',s:'I would have called you earlier, but my phone died, and I couldn’t find my charger anywhere.',q:'Why didn’t the speaker call earlier?',o:['The phone had no battery','They forgot the number','They were busy at work','They lost the phone']},
{p:1,v:4,t:'Listening: nuances e expressões',s:'Honestly, I wouldn’t say the movie was bad. It just didn’t live up to the hype everyone had built around it.',q:'What does the speaker mean?',o:['It was good, but not as great as expected','The movie was terrible','He hasn’t seen it','Everyone loved it']}
];
const app=document.getElementById('app');
let i=0,name='',wa='',mail='',hp='',ans=[],ord=[],plays=[];
const ENDPOINT='enviar-resultado.php'; /* arquivo PHP na mesma pasta */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);

function intro(){
  app.innerHTML=`<div class="card" style="margin-top:6px">
    <label for="nm"><b>Nome</b></label>
    <input id="nm" type="text" autocomplete="name" placeholder="Seu nome completo" value="${esc(name)}">
    <label for="wa"><b>WhatsApp</b></label>
    <input id="wa" type="tel" inputmode="tel" autocomplete="tel" placeholder="(11) 91234-5678" value="${esc(wa)}">
    <label for="ml"><b>E-mail</b> <span class="mut">(opcional)</span></label>
    <input id="ml" type="email" autocomplete="email" placeholder="voce@email.com" value="${esc(mail)}">
    <input id="hp" type="text" name="site" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <label class="ck"><input id="ok" type="checkbox"><span>Autorizo a escola a entrar em contato comigo por WhatsApp ou e-mail.</span></label>
    <p id="er" style="color:var(--acc);min-height:1.4em;margin:-8px 0 10px;font-size:15px"></p>
    <button class="btn" onclick="start()">Começar o teste</button>
    <p class="mut" style="font-size:14px;margin:14px 0 0">Não sabe a resposta? Toque em Não sei.</p>
  </div>`;
}
function start(){
  const n=document.getElementById('nm').value.trim(),w=document.getElementById('wa').value.trim(),m=document.getElementById('ml').value.trim(),er=document.getElementById('er');
  if(n.length<2){er.textContent='Digite seu nome.';return}
  if(w.replace(/\D/g,'').length<10){er.textContent='Digite seu WhatsApp com DDD.';return}
  if(m&&!/^\S+@\S+\.\S+$/.test(m)){er.textContent='Confira o e-mail.';return}
  if(!document.getElementById('ok').checked){er.textContent='Marque a autorização para continuar.';return}
  hp=document.getElementById('hp').value;name=n;wa=w;mail=m;i=0;ans=[];plays=[];ord=Q.map(()=>shuffle([0,1,2,3]));view();
}
function view(){
  const q=Q[i],a=ans[i];
  const listen=q.p?`<button class="play" onclick="play()" ${(plays[i]||0)>=2?'disabled':''}>▶ Ouvir o áudio <span style="font-weight:400">(${2-(plays[i]||0)} restantes)</span></button><p class="mut" style="font-size:14px">Se o áudio não tocar, use o Chrome ou o Safari e aumente o volume.</p>`:'';
  app.innerHTML=`<div class="top"><span>${q.p?'Parte 2 · Listening':'Parte 1 · Gramática e vocabulário'}</span><span>${i+1} de ${Q.length}</span></div>
  <div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
  <h2>${esc(q.q)}</h2>${listen}
  <div role="group" aria-label="Alternativas">${ord[i].map(k=>`<button class="opt ${a===k?'sel':''}" aria-pressed="${a===k}" onclick="pick(${k})">${esc(q.o[k])}</button>`).join('')}</div>
  <div class="row"><span>${i>0?'<button class="btn ghost" onclick="back()">← Voltar</button>':''}<button class="btn ghost" onclick="pick('x')">${a==='x'?'✓ ':''}Não sei</button></span>
  <button class="btn" onclick="next()" ${a===undefined?'disabled':''}>${i==Q.length-1?'Ver resultado':'Próxima'}</button></div>`;
  window.scrollTo(0,0);
}
function pick(k){ans[i]=k;view();}
function back(){try{speechSynthesis.cancel()}catch(e){}i--;view();}
function next(){try{speechSynthesis.cancel()}catch(e){}i++;i<Q.length?view():result();}
function play(){
  plays[i]=(plays[i]||0)+1;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(Q[i].s);u.lang='en-US';u.rate=.9;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.replace('_','-')==='en-US');if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}
  view();
}
function result(){
  const g=[0,0,0,0,0],l=[0,0,0,0,0],wrong=new Set(),nk=new Set();
  Q.forEach((q,n)=>{
    const ok=ans[n]===0;
    if(ok)(q.p?l:g)[q.v]++;
    else if(ans[n]==='x')nk.add(q.t);
    else wrong.add(q.t);
  });
  let lv=-1;for(let n=0;n<5;n++){if(g[n]>=3)lv=n;else break;}
  const lname=lv<0?'Pre-A1':L[lv];
  const start=L[Math.max(lv,0)];
  let ll=-1;for(let n=0;n<5;n++){if(l[n]===1)ll=n;else break;}
  const lis=l.reduce((a,b)=>a+b,0);
  const tot=g.reduce((a,b)=>a+b,0);
  const fix=[...wrong].filter(t=>!nk.has(t)),unk=[...nk];
  const sum=`Teste de nivelamento: ${name}\nWhatsApp: ${wa}\nE-mail: ${mail||'-'}\nNível (gramática/vocabulário): ${lname}\n`+L.map((x,n)=>`${x}: ${g[n]}/4`).join(' | ')+`\nListening: ${lis}/5 (entende até ~${ll<0?'Pre-A1':L[ll]})\nPonto de partida sugerido: início do ${start}\nErrou: ${fix.join(', ')||'-'}\nNão sabia: ${unk.join(', ')||'-'}`;
  setTimeout(()=>sendResult({nome:name,whatsapp:wa,email:mail,consent:true,site:hp,nivel:lname,gramatica:g,listening:lis,listeningNivel:ll<0?'Pre-A1':L[ll],partida:start,errou:fix,naoSabia:unk}),0);
  app.innerHTML=`<p class="mut" style="margin-bottom:0">${esc(name)}, seu nível é</p>
  <div class="lvlbig">${lname}</div>
  <div class="ladder" aria-hidden="true">${L.map((x,n)=>`<div class="${n<=lv?'on':''}" style="height:${34+n*24}%">${x}</div>`).join('')}</div>
  <div class="card" style="margin-top:14px">
    <h3>Resultado por nível</h3>
    <table>${L.map((x,n)=>`<tr><td>${x}</td><td>${g[n]}/4</td></tr>`).join('')}<tr><td>Listening</td><td>${lis}/5</td></tr></table>
    <p>Ponto de partida sugerido: <b>início do ${start}</b>, revisando os pontos abaixo.</p>
    ${fix.length?`<h3 style="font-size:17px">Errou</h3><div class="chips">${fix.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}
    ${unk.length?`<h3 style="font-size:17px">Marcou “Não sei”</h3><div class="chips">${unk.map(t=>`<span class="chip nk">${esc(t)}</span>`).join('')}</div>`:''}
    ${tot===20?'<p>Gabarito perfeito na parte escrita. Vale um papo de speaking pra confirmar o nível.</p>':''}
    <p id="st" class="mut" style="font-size:14px;margin:6px 0 0" role="status"></p>
    <textarea id="sm" readonly>${esc(sum)}</textarea>
    <div class="row"><button class="btn" onclick="copySum()" id="cp">Copiar resultado</button><button class="btn ghost" onclick="intro()">Refazer</button></div>
  </div>`;
  window.scrollTo(0,0);
}
async function sendResult(p){
  const st=document.getElementById('st');if(!st)return;
  if(/claude|anthropic/i.test(location.hostname)){st.textContent='Prévia: o envio por e-mail só funciona quando o teste estiver no site da escola.';return}
  st.textContent='Enviando seu resultado para a escola...';
  try{
    const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
    const j=await r.json();
    if(r.ok&&j.ok){st.textContent='Resultado enviado para a escola. Em breve entraremos em contato.'}else{throw new Error('envio')}
  }catch(e){st.textContent='Não foi possível enviar automaticamente. Copie o resultado abaixo e envie para a escola.'}
}
function copySum(){
  const t=document.getElementById('sm');t.select();
  let done=false;try{navigator.clipboard.writeText(t.value);done=true}catch(e){}
  if(!done){try{done=document.execCommand('copy')}catch(e){}}
  document.getElementById('cp').textContent=done?'Copiado!':'Selecione e copie o texto';
}
try{speechSynthesis.getVoices()}catch(e){}
intro();
</script>
